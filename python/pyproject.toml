[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "huyab-install-tools"
version = "1.0.1"
license = "MIT"
license-files = ["LICENSE"]
description ="Install the generic dev CLI tools (bws, gh, mise, cf, wrangler, biome, cloudflared, browse, gitleaks, jq, rg, fd) with one command. Changes to git, ssh or shell config are opt-in."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Installation/Setup",
]

[project.urls]
Source = "https://github.com/nguyenhuy158/huyabhome/tree/main/python"

[project.scripts]
install-tools = "install_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
install_tools = ["install-tools.sh"]
